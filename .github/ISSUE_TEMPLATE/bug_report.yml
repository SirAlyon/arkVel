name: "🐛 Bug report"
description: Report a reproducible problem in ArkVel
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do **not** report security
        vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Where did it happen and in which panel/area?
      value: |
        - Area: public site / `/account` / `/manage` / `/admin`
        - Browser / device:
        - ArkVel version or commit:
        - Self-hosted or the hosted beta:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant log lines (`storage/logs/laravel.log`) or screenshots. Redact any personal data.
    validations:
      required: false
