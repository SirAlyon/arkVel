server {
    listen *:80;
    server_name _;

    root /var/www/html/arkvel/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Compressione (UI-8). L'immagine nginx:alpine non ha il modulo brotli (verificato con
    # `nginx -V`): resta gzip, dinamico. Immagini e font woff2 sono già compressi e restano
    # fuori; text/html è sempre compresso da nginx e non va elencato.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset di Vite: il nome contiene l'hash del contenuto, quindi non cambiano mai.
    # manifest.json invece ha un nome fisso e cambia a ogni build: niente cache lunga.
    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location = /build/manifest.json {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }

    # Immagini statiche del sito (nomi senza hash): una settimana, poi rivalidazione.
    location ^~ /images/ {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=604800" always;
    }
    # robots.txt è dinamico (RobotsTxtController: riga Sitemap con l'URL assoluto): se non
    # c'è un file statico passa a Laravel.
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # Le risposte HTML arrivano da PHP con i loro header (Cache-Control: no-cache, private
    # di Laravel; Vary e Content-Language dal middleware ContentLanguage): nginx non ne
    # aggiunge di suoi.
    location ~ \.php$ {
        include fastcgi_params;
        include fastcgi-php.conf;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
